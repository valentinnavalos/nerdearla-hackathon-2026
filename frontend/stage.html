<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Escenario</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<main class="stage">
  <header class="bar">
    <div class="meter"><div id="meter-fill" class="meter-fill"></div></div>
    <div class="room">
      <strong id="room-title" class="room-title"></strong>
      <span id="conn" class="conn"></span>
    </div>
    <div class="controls">
      <span id="lat-badge" class="badge" hidden></span>
      <div class="lang-toggle" role="group" aria-label="Idioma">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" id="fullscreen" class="icon-btn" aria-label="Pantalla completa">⛶</button>
    </div>
  </header>

  <div id="mic-panel" class="mic-panel" hidden>
    <button type="button" id="mic-toggle" class="btn">Iniciar captura</button>
    <select id="mic-select" aria-label="Micrófono"></select>
    <span id="mic-status" class="conn"></span>
  </div>

  <p id="notice" class="notice" hidden></p>
  <section id="captions" class="captions" aria-live="polite"></section>

  <div id="qr-box" class="stage-qr" hidden>
    <canvas id="qr"></canvas>
    <span id="qr-url"></span>
  </div>
</main>

<script type="module">
import { CaptionView } from "./js/captions.js";
import { MicCapture } from "./js/mic.js";
import { STATUS_LABELS, el, fetchJSON, qs } from "./js/common.js";

const sessionId = qs("s");
const token = qs("token") || "";
let lang = qs("lang") === "en" ? "en" : "es";

const title = document.getElementById("room-title");
const conn = document.getElementById("conn");
const notice = document.getElementById("notice");
const latBadge = document.getElementById("lat-badge");
let status = null;
let connection = "connecting";

function paintConn(retryInS) {
  const labels = {
    connecting: "conectando…",
    open: status && status !== "RUNNING" ? (STATUS_LABELS[status] ?? status) : "● en vivo",
    reconnecting: `reconectando en ${retryInS}s…`,
    not_found: "",
  };
  conn.textContent = labels[connection] ?? "";
  conn.className = `conn conn-${connection}${connection === "open" && status === "RUNNING" ? " live" : ""}`;
}

function showNotice(text) {
  notice.textContent = text;
  notice.hidden = !text;
}

const view = new CaptionView(document.getElementById("captions"), {
  lines: 2,
  onStatus(s) {
    status = s;
    paintConn();
    showNotice(s === "STOPPED" ? "La charla terminó" : "");
  },
  onConnection(state, retryInS) {
    connection = state;
    paintConn(retryInS);
    if (state === "not_found") showNotice("Sala no encontrada");
  },
});

const langButtons = document.querySelectorAll(".lang-toggle button");
function setLang(next) {
  lang = next;
  for (const b of langButtons) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  view.connect(sessionId, lang);
}
for (const b of langButtons) b.addEventListener("click", () => b.dataset.lang !== lang && setLang(b.dataset.lang));

document.getElementById("fullscreen").addEventListener("click", () => {
  document.documentElement.requestFullscreen?.().catch(() => {});
});

// --- QR to the audience view -------------------------------------------------

function showQr() {
  const url = `${location.origin}/?s=${encodeURIComponent(sessionId)}&lang=es`;
  document.getElementById("qr-url").textContent = url;
  if (window.QRCode) new QRCode(document.getElementById("qr"), { text: url, width: 120, height: 120 });
  document.getElementById("qr-box").hidden = false;
}

// --- mic capture (only for source: "mic" rooms) -------------------------------

const meterFill = document.getElementById("meter-fill");
const micPanel = document.getElementById("mic-panel");
const micToggle = document.getElementById("mic-toggle");
const micSelect = document.getElementById("mic-select");
const micStatus = document.getElementById("mic-status");

const mic = new MicCapture({
  onLevel(dbfs) {
    const pct = Math.max(0, Math.min(100, (dbfs + 60) * (100 / 60)));
    meterFill.style.width = `${pct}%`;
    meterFill.classList.toggle("loud", dbfs > -6);
  },
  onStatus(state) {
    const labels = { idle: "", starting: "iniciando…", capturing: "capturando", stopped: "", error: "error de mic: sala no iniciada" };
    micStatus.textContent = labels[state] ?? "";
    micToggle.textContent = state === "capturing" ? "Detener" : "Iniciar captura";
    if (state === "stopped" || state === "error") capturing = false;
  },
  onIngestStatus(msg) {
    if (typeof msg.lat_p50_ms === "number") {
      latBadge.hidden = false;
      latBadge.textContent = `${Math.round(msg.lat_p50_ms)} ms`;
    }
    if (msg.mic_connected === false) micStatus.textContent = "mic desconectado";
  },
});

async function setupMicPanel() {
  micPanel.hidden = false;
  try {
    const devices = await mic.listDevices();
    micSelect.replaceChildren(...devices.map((d, i) =>
      el("option", { value: d.deviceId }, d.label || `Micrófono ${i + 1}`)));
  } catch {
    /* permission not granted yet: list will populate after the first start() */
  }
}

const RUNNING_STATUSES = new Set(["RUNNING", "ROTATING", "RECONNECTING"]);

async function ensureSessionStarted() {
  if (status && RUNNING_STATUSES.has(status)) return;
  try {
    await fetchJSON(`/api/sessions/${encodeURIComponent(sessionId)}/start`, {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
    });
  } catch (err) {
    // a room already running (race with another admin, or our own stale `status`) is fine:
    // the backend answers 409 for a capacity conflict and an unhandled 500 for the plain
    // "ya está corriendo" RuntimeError (core/session.py has no dedicated exception handler for it)
    const msg = String(err.message || err);
    if (!msg.startsWith("409") && !msg.startsWith("500")) throw err;
  }
}

let capturing = false;
micToggle.addEventListener("click", async () => {
  if (capturing) {
    mic.stop();
    capturing = false;
    return;
  }
  try {
    await ensureSessionStarted();
    await mic.start(sessionId, token, micSelect.value || undefined);
    capturing = true;
    const devices = await mic.listDevices();
    micSelect.replaceChildren(...devices.map((d, i) =>
      el("option", { value: d.deviceId }, d.label || `Micrófono ${i + 1}`)));
  } catch (err) {
    alert(`No se pudo iniciar la captura: ${err.message || err}`);
  }
});

// --- boot ----------------------------------------------------------------------

fetchJSON("/api/public/sessions")
  .then((rooms) => {
    const room = rooms.find((r) => r.id === sessionId);
    if (room) {
      title.textContent = room.title;
      document.title = `${room.title} · Escenario`;
    }
  })
  .catch(() => {});

setLang(lang);
showQr();
if (token) {
  fetchJSON("/api/sessions", { headers: { Authorization: `Bearer ${token}` } })
    .then((data) => {
      const room = data.sessions.find((r) => r.id === sessionId);
      if (room && room.source === "mic") setupMicPanel();
    })
    .catch(() => {});
}
</script>
</body>
</html>
