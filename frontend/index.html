<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Subtítulos en vivo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="list-view" class="list-view" hidden>
  <header class="brand">
    <h1>Subtítulos en vivo</h1>
    <p class="sub">Elegí la sala y el idioma · Pick a room and a language</p>
  </header>
  <ul id="rooms" class="rooms"></ul>
  <p id="rooms-empty" class="empty" hidden>Todavía no hay salas activas · No rooms yet</p>
  <p id="rooms-error" class="empty" hidden>No se pudo cargar la lista, reintentando…</p>
</main>

<main id="caption-view" class="caption-view" hidden>
  <header class="bar">
    <a href="./" class="btn icon-btn back" aria-label="Volver a las salas">←</a>
    <div class="room">
      <strong id="room-title" class="room-title"></strong>
      <span id="conn" class="conn"></span>
    </div>
    <div class="controls">
      <span id="direction-badge" hidden></span>
      <div class="lang-toggle" role="group" aria-label="Idioma">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" id="smaller" class="icon-btn" aria-label="Achicar letra">A−</button>
      <button type="button" id="bigger" class="icon-btn" aria-label="Agrandar letra">A+</button>
      <button type="button" id="contrast" class="icon-btn" aria-pressed="false" aria-label="Alto contraste">◐</button>
    </div>
  </header>
  <p id="notice" class="notice" hidden></p>
  <section id="captions" class="captions" aria-live="polite"></section>
</main>

<script type="module">
import { CaptionView } from "./js/captions.js";
import { LANG_LABELS, STATUS_LABELS, el, fetchJSON, qs, storage, renderDirectionBadge } from "./js/common.js";

const FONT_STEPS = [1.4, 1.75, 2.2, 2.75, 3.4]; // rem
const sessionId = qs("s");

if (sessionId) showCaptions(sessionId);
else showList();

// --- room list ---------------------------------------------------------------

function showList() {
  document.getElementById("list-view").hidden = false;
  const list = document.getElementById("rooms");
  const empty = document.getElementById("rooms-empty");
  const error = document.getElementById("rooms-error");

  async function refresh() {
    try {
      const rooms = await fetchJSON("/api/public/sessions");
      error.hidden = true;
      empty.hidden = rooms.length > 0;
      list.replaceChildren(...rooms.map(roomItem));
    } catch {
      error.hidden = false;
    }
  }
  refresh();
  setInterval(refresh, 5000);
}

function roomItem(room) {
  const langs = [room.target_lang, room.source_lang].map((lang) =>
    el("a", { class: "btn", href: `?s=${encodeURIComponent(room.id)}&lang=${lang}` }, LANG_LABELS[lang]),
  );
  return el(
    "li",
    { class: "room-card" },
    el(
      "div",
      { class: "room-head" },
      el("span", { class: "room-name" }, room.title),
      el("span", { class: `badge status-${room.status.toLowerCase()}` }, STATUS_LABELS[room.status] ?? room.status),
    ),
    room.speaker ? el("span", { class: "speaker" }, room.speaker) : "",
    el("div", { class: "room-langs" }, ...langs),
  );
}

// --- captions ----------------------------------------------------------------

function showCaptions(id) {
  document.getElementById("caption-view").hidden = false;
  const title = document.getElementById("room-title");
  const conn = document.getElementById("conn");
  const notice = document.getElementById("notice");
  let lang = qs("lang") === "en" ? "en" : "es";
  let status = null;
  let connection = "connecting";

  // Overlay mode for OBS/vMix (T3.1): ?overlay=1&bg=transparent|green&size=L&lines=2
  const overlay = qs("overlay") === "1";
  if (overlay) {
    const bg = qs("bg") === "green" ? "green" : "transparent";
    document.body.classList.add("overlay", `bg-${bg}`);
  }
  const overlayLines = overlay ? Number(qs("lines")) || 3 : 3;

  function paintConn(retryInS) {
    const labels = {
      connecting: "conectando…",
      open: status && status !== "RUNNING" ? (STATUS_LABELS[status] ?? status) : "● en vivo",
      reconnecting: `reconectando en ${retryInS}s…`,
      not_found: "",
    };
    conn.textContent = labels[connection] ?? "";
    conn.className = `conn conn-${connection}${connection === "open" && status === "RUNNING" ? " live" : ""}`;
  }

  function showNotice(text) {
    notice.textContent = text;
    notice.hidden = !text;
  }

  const view = new CaptionView(document.getElementById("captions"), {
    lines: overlayLines,
    onStatus(s) {
      status = s;
      paintConn();
      showNotice(s === "STOPPED" ? "La charla terminó · The talk has ended" : "");
    },
    onConnection(state, retryInS) {
      connection = state;
      paintConn(retryInS);
      if (state === "not_found") showNotice("Sala no encontrada · Room not found");
    },
  });

  // language toggle: reconnects the WS, no reload
  const langButtons = document.querySelectorAll(".lang-toggle button");
  function setLang(next) {
    lang = next;
    for (const b of langButtons) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    document.documentElement.lang = lang;
    const url = new URL(location.href);
    url.searchParams.set("lang", lang);
    history.replaceState(null, "", url);
    view.connect(id, lang);
  }
  for (const b of langButtons) b.addEventListener("click", () => b.dataset.lang !== lang && setLang(b.dataset.lang));

  // font size + high contrast (per-viewer, remembered) — overlay mode uses its own
  // fixed size from ?size= instead, and never persists it (OBS reopens the page fresh).
  if (overlay) {
    const step = qs("size") === "L" ? FONT_STEPS.length - 1 : 2;
    document.documentElement.style.setProperty("--caption-size", `${FONT_STEPS[step]}rem`);
  } else {
    let fontStep = storage.get("captions.fontStep", 2);
    let contrast = storage.get("captions.contrast", false);
    function applyPrefs() {
      document.documentElement.style.setProperty("--caption-size", `${FONT_STEPS[fontStep]}rem`);
      document.body.classList.toggle("contrast", contrast);
      document.getElementById("contrast").setAttribute("aria-pressed", String(contrast));
      storage.set("captions.fontStep", fontStep);
      storage.set("captions.contrast", contrast);
    }
    document.getElementById("smaller").addEventListener("click", () => { fontStep = Math.max(0, fontStep - 1); applyPrefs(); });
    document.getElementById("bigger").addEventListener("click", () => { fontStep = Math.min(FONT_STEPS.length - 1, fontStep + 1); applyPrefs(); });
    document.getElementById("contrast").addEventListener("click", () => { contrast = !contrast; applyPrefs(); });
    applyPrefs();
  }

  title.textContent = id;
  fetchJSON("/api/public/sessions")
    .then((rooms) => {
      const room = rooms.find((r) => r.id === id);
      if (room) {
        title.textContent = room.title;
        document.title = `${room.title} · Subtítulos`;
        const directionBadge = document.getElementById("direction-badge");
        directionBadge.replaceChildren(renderDirectionBadge(room.source_lang, room.target_lang));
        directionBadge.hidden = false;
      }
    })
    .catch(() => {});

  setLang(lang);
}
</script>
</body>
</html>
